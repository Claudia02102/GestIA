# P3-24: compila el instalador de Windows y lo publica en GitHub Releases.
#
# - Al subir un tag «vX.Y.Z» (igual a la versión de pyproject.toml) crea la Release con
#   GestIA-Setup.exe. La landing descarga siempre la última:
#   https://github.com/Claudia02102/GestIA/releases/latest/download/GestIA-Setup.exe
# - Ejecutado a mano (Actions → Instalador → Run workflow) solo deja el instalador como
#   artefacto para probarlo, sin publicar nada.
name: Instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "El tag $env:GITHUB_REF_NAME no coincide con la versión $version de pyproject.toml"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.11.1

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest

      - name: Modelo de MediaPipe
        run: python tools/download_model.py

      - name: Ejecutable (PyInstaller)
        run: pyinstaller packaging/gestia.spec --noconfirm

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.value }} packaging/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: GestIA-Setup-${{ steps.version.outputs.value }}
          path: dist/GestIA-Setup.exe
          if-no-files-found: error

      - name: Publicar Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/GestIA-Setup.exe --title "GestIA ${{ steps.version.outputs.value }}" --generate-notes
