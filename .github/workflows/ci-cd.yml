# CI/CD de GestIA (P3-67; antes P3-55, P3-56, P3-57, P3-59 y P3-24), en etapas:
#
#   1. Lint ──► 2. Pruebas (Py 3.11 y 3.12) ─┐
#            ├► 3. Dependencias (pip-audit) ─┼─► 4. CD: instalador de Windows
#            └► 3. Secretos (gitleaks) ──────┘
#
# Cada etapa corre solo si la anterior pasó. En un pull request se detiene antes del CD: el
# instalador solo se compila con código ya revisado.
# - Push a main: compila el instalador y lo deja como artefacto en Actions (instalador de prueba
#   de lo último que se unió), sin publicar ninguna versión.
# - Tag «vX.Y.Z» (igual a la versión de pyproject.toml): además lo publica en GitHub Releases,
#   de donde la landing descarga siempre la última versión.
name: CI/CD GestIA

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Un push nuevo a un PR cancela la revisión anterior; una publicación nunca se cancela.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: 1. Lint y SAST (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La versión de ruff es la de pyproject.toml, así Dependabot la actualiza en un solo lugar.
      - name: Instalar ruff
        run: python -m pip install "$(grep -o 'ruff==[0-9.]*' pyproject.toml)"

      # Las reglas S de ruff (equivalentes a Bandit) son el análisis estático de seguridad (P3-59).
      - name: Reglas de estilo y de seguridad
        run: python -m ruff check . --output-format=github

      - name: Formato
        run: python -m ruff format --check .

  pruebas:
    name: 2. Pruebas (Python ${{ matrix.python }})
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Sin cámara ni modelo descargado: las pruebas marcadas «camara» o «modelo» se excluyen.
      # Con cobertura (P3-67): falla si baja del mínimo de pyproject.toml (fail_under).
      - name: Pytest con cobertura
        run: >-
          python -m pytest -m "not camara and not modelo" --junitxml=reporte-pruebas.xml
          --cov --cov-report=term --cov-report=xml:cobertura.xml --cov-report=html:cobertura-html

      - name: Resumen de pruebas y cobertura
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path reporte-pruebas.xml)) { exit 0 }
          $suite = ([xml](Get-Content reporte-pruebas.xml)).testsuites.testsuite
          $passed = [int]$suite.tests - [int]$suite.failures - [int]$suite.errors - [int]$suite.skipped
          $lineas = "-"; $ramas = "-"
          if (Test-Path cobertura.xml) {
            $cov = ([xml](Get-Content cobertura.xml)).coverage
            $lineas = "{0:N1} %" -f ([double]$cov.'line-rate' * 100)
            $ramas = "{0:N1} %" -f ([double]$cov.'branch-rate' * 100)
          }
          @(
            "### Pruebas automatizadas (Python ${{ matrix.python }})",
            "",
            "| Pasaron | Fallaron | Errores | Omitidas | Tiempo | Cobertura de líneas | Cobertura de ramas |",
            "| --- | --- | --- | --- | --- | --- | --- |",
            "| $passed | $($suite.failures) | $($suite.errors) | $($suite.skipped) | $([math]::Round([double]$suite.time, 1)) s | $lineas | $ramas |"
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # Descargable desde la ejecución en Actions: abrir cobertura-html/index.html.
      - name: Reporte de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-py${{ matrix.python }}
          path: |
            reporte-pruebas.xml
            cobertura.xml
            cobertura-html/
          if-no-files-found: ignore

  dependencias:
    name: 3. Seguridad - dependencias (pip-audit)
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # P3-56: vulnerabilidades conocidas en las librerías instaladas en Windows. pip-audit no da
      # la gravedad, así que cualquier aviso falla salvo que esté documentado en
      # .github/pip-audit-excepciones.txt (ID, motivo y fecha de revisión).
      - name: Dependencias vulnerables (pip-audit)
        shell: pwsh
        run: |
          python -m pip freeze --exclude-editable > requisitos-auditados.txt
          python -m pip install pip-audit==2.10.1
          $ignorar = Get-Content .github/pip-audit-excepciones.txt |
            Where-Object { $_.Trim() -and -not $_.TrimStart().StartsWith("#") } |
            ForEach-Object { ($_ -split "\|")[0].Trim() -split "\s+" } |
            ForEach-Object { "--ignore-vuln"; $_ }
          python -m pip_audit -r requisitos-auditados.txt --no-deps --disable-pip --desc on @ignorar

  secretos:
    name: 3. Seguridad - secretos (gitleaks)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # P3-57: busca claves, tokens y contraseñas en TODO el historial, no solo en el último
      # commit. gitleaks se descarga con versión fija y se verifica su SHA-256.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum --check
          tar -xzf "$archivo" gitleaks

      - name: Escanear el historial
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  instalador:
    name: 4. CD - instalador de Windows
    needs: [pruebas, dependencias, secretos]
    # En los pull requests se omite: solo se entrega código que ya pasó la revisión.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "El tag $env:GITHUB_REF_NAME no coincide con la versión $version de pyproject.toml"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.11.1

      - name: Modelo de MediaPipe
        run: python tools/download_model.py

      - name: Ejecutable (PyInstaller)
        run: pyinstaller packaging/gestia.spec --noconfirm

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.value }} packaging/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: GestIA-Setup-${{ steps.version.outputs.value }}
          path: dist/GestIA-Setup.exe
          if-no-files-found: error

      - name: Publicar Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/GestIA-Setup.exe --title "GestIA ${{ steps.version.outputs.value }}" --generate-notes

      - name: Resumen de la entrega
        shell: pwsh
        run: |
          $destino = if ($env:GITHUB_REF_TYPE -eq "tag") { "publicado en GitHub Releases" } else { "disponible como artefacto de esta ejecución" }
          @(
            "### Instalador GestIA ${{ steps.version.outputs.value }}",
            "",
            "GestIA-Setup.exe $destino."
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
