# P3-55: integración continua del software.
#
# Cada pull request y cada push a main se revisan con ruff (estilo y formato) y pytest en
# Windows, el sistema donde corre GestIA (pynput, PySide6 y os.startfile dependen de él).
# También corre los controles de seguridad: reglas S de ruff (SAST, P3-59) y pip-audit
# (dependencias, P3-56).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Ruff y pytest (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (reglas)
        run: python -m ruff check . --output-format=github

      - name: Ruff (formato)
        run: python -m ruff format --check .

      # Sin cámara ni modelo descargado: las pruebas marcadas «camara» o «modelo» se excluyen.
      - name: Pytest
        run: python -m pytest -m "not camara and not modelo" --junitxml=reporte-pruebas.xml

      # P3-56: vulnerabilidades conocidas en las librerías instaladas (Windows, Python 3.12).
      # pip-audit no da la gravedad, así que cualquier aviso falla el CI salvo que esté
      # documentado en .github/pip-audit-excepciones.txt (ID, motivo y fecha de revisión).
      - name: Dependencias vulnerables (pip-audit)
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          python -m pip freeze --exclude-editable > requisitos-auditados.txt
          python -m pip install pip-audit==2.10.1
          $ignorar = Get-Content .github/pip-audit-excepciones.txt |
            Where-Object { $_.Trim() -and -not $_.TrimStart().StartsWith("#") } |
            ForEach-Object { ($_ -split "\|")[0].Trim() -split "\s+" } |
            ForEach-Object { "--ignore-vuln"; $_ }
          python -m pip_audit -r requisitos-auditados.txt --no-deps --disable-pip --desc on @ignorar

      - name: Reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-py${{ matrix.python }}
          path: reporte-pruebas.xml
          if-no-files-found: ignore

  # P3-57: busca claves, tokens y contraseñas en TODO el historial del repositorio, no solo en
  # el último commit. gitleaks se descarga con versión fija y se verifica su SHA-256.
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum --check
          tar -xzf "$archivo" gitleaks

      - name: Escanear el historial
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
