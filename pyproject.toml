[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gestia"
version = "0.7.0"
description = "Control del computador con gestos faciales"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "PySide6==6.8.2.1",
  "pynput==1.8.1",
]
[project.optional-dependencies]
dev = ["pre-commit==4.7.0", "pytest==9.0.3", "pytest-cov==7.1.0", "ruff==0.9.10"]
[project.scripts]
gestia = "gestia.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
gestia = ["assets/*.svg"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
# Pruebas que necesitan hardware o archivos externos: CI las excluye (P3-55).
markers = [
  "camara: usa la cámara web real",
  "modelo: usa el modelo de MediaPipe descargado (models/face_landmarker.task)",
]
# Cobertura (P3-67): qué parte del código de la app ejecutan las pruebas del CI.
[tool.coverage.run]
source = ["gestia"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 70
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
# «S»: reglas de seguridad de Bandit (P3-59). Las excepciones van por línea, con su motivo.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# En las pruebas, assert es la forma normal de comprobar resultados.
"tests/**" = ["S101"]
