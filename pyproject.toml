[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gestia"
version = "0.3.0"
description = "Control del computador con gestos faciales - Sprint 3"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "PySide6==6.8.2.1",
  "pynput==1.8.1",
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]
[project.scripts]
gestia = "gestia.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
